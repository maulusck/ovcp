name: ci

# Every push and PR runs `make check` (BUILD.md, Tests). A v* tag then builds
# every TARGET, publishes the GitHub release and the ghcr.io image, only once
# the gates pass. See BUILD.md for each stage.
on: [push, pull_request]

defaults:
  run:
    shell: bash # explicit shell: bash adds -o pipefail, so no pipe can mask a failing command

# Toolchain versions have one home each (`make versions`): setup-go and
# setup-node read go.mod and web/ui/.nvmrc, the rest comes from make versions.

jobs:
  test:
    runs-on: ubuntu-24.04
    steps: # each action pinned once: the build and image jobs reuse these steps
      - &checkout
        uses: actions/checkout@v7
        with: { fetch-depth: 0 } # git describe needs tag history for VERSION
      - &setup-go
        uses: actions/setup-go@v7
        with: { go-version-file: go.mod }
      - &setup-node
        uses: actions/setup-node@v7
        with: { node-version-file: web/ui/.nvmrc }
      - name: install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mandoc openvpn dnsmasq-base nftables uidmap
          # 24.04's AppArmor denies unprivileged user namespaces; the rootless E2E needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # TestDropRoot maps subordinate ids (unshare --map-auto)
          grep -q "^$USER:" /etc/subuid || echo "$USER:100000:65536" | sudo tee -a /etc/subuid /etc/subgid
      - run: make check # BUILD.md, Tests: the same gate a commit runs

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [host, arm64, armv7, armv6, riscv64, amd64-musl, arm64-musl, armv7-musl, armv6-musl, riscv64-musl]
    steps:
      - *checkout
      - run: make -s versions >> "$GITHUB_ENV"
      - *setup-go
      - *setup-node
      - name: install mandoc + nfpm
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mandoc
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" | tar -xz -C "$RUNNER_TEMP" nfpm
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: install zig
        if: matrix.target != 'host' # only the cross-compile targets need it
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-$ZIG_VERSION" >> "$GITHUB_PATH"
      - name: build + package
        run: |
          make release TARGET=${{ matrix.target }}
          mkdir -p out
          tar czf "out/ovcp-${{ matrix.target }}.tar.gz" -C bin ovcp -C ../dist/completion ovcp.bash ovcp.zsh ovcp.fish
          case "${{ matrix.target }}" in
            *-musl) make apk TARGET=${{ matrix.target }} ;;
            *)      make deb rpm archlinux TARGET=${{ matrix.target }} ;;
          esac
          cp dist/*.deb dist/*.rpm dist/*.zst dist/*.apk out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { path: out, merge-multiple: true }
      - run: cd out && sha256sum -- * > SHA256SUMS
      - run: gh release create "${{ github.ref_name }}" out/* --generate-notes
        env: # no checkout here: gh is told its repo, not left to find it in git
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

  image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions: { packages: write }
    steps:
      - *checkout
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/riscv64 \
            --build-arg VERSION="${GITHUB_REF_NAME#v}" \
            $(make -s image-args) \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            -t "ghcr.io/${{ github.repository }}:latest" \
            --push \
            -f Containerfile .
