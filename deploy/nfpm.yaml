name: ovcp
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: &maintainer Maulusck <maulusck@pm.me>
description: OpenVPN Control Plane — web UI and native PKI for OpenVPN
license: MIT
depends: [openvpn]
# optional at runtime: dnsmasq gates the Records tab, nftables the Upstreams tab;
# deb and rpm suggest them, apk and Arch have no such field.
suggests: [dnsmasq, nftables]
scripts:
  postinstall: &postinstall deploy/postinstall.sh
# deb and rpm re-run postinstall on upgrade; apk and pacman run a separate hook
apk: { scripts: { postupgrade: *postinstall } }
archlinux: { packager: *maintainer, scripts: { postupgrade: *postinstall } }
contents:
  - src: dist/root/
    dst: /
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/ovcp/LICENSE
  - src: deploy/selinux.sh # postinstall calls it everywhere; a no-op without SELinux
    dst: /usr/lib/ovcp/selinux.sh
    file_info:
      mode: 0755
  # init system per packager: systemd for deb/rpm/archlinux, OpenRC for apk.
  - &unit
    src: deploy/systemd/ovcp.service
    dst: /usr/lib/systemd/system/ovcp.service
    packager: deb
  - { <<: *unit, packager: rpm }
  - { <<: *unit, packager: archlinux }
  - src: deploy/openrc/ovcp.initd
    dst: /etc/init.d/ovcp
    packager: apk
    file_info:
      mode: 0755
  # OpenWrt's procd script; postinstall puts it in place there
  - src: deploy/openwrt/ovcp.init
    dst: /usr/lib/ovcp/ovcp.procd-init
    packager: apk
    file_info:
      mode: 0755
