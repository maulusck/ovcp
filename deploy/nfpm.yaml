name: ovcp
arch: ${ARCH}
platform: linux
version: ${VERSION}
maintainer: &maintainer Maulusck <maulusck@pm.me>
description: OpenVPN Control Plane — web UI and native PKI for OpenVPN
license: MIT
depends: [openvpn]
# optional: dnsmasq gates the Records tab, nftables gates the Upstreams tab —
# both advisory at runtime, ovcp works fully without either. apk/archlinux
# have no such concept and just drop this field; deb/rpm get real Suggests:.
suggests: [dnsmasq, nftables]
archlinux: { packager: *maintainer }
scripts:
  postinstall: deploy/postinstall.sh
contents:
  - src: dist/root/
    dst: /
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/ovcp/LICENSE
  - src: deploy/selinux.sh # postinstall calls it everywhere; a no-op without SELinux
    dst: /usr/lib/ovcp/selinux.sh
    file_info:
      mode: 0755
  # init system per packager: systemd for deb/rpm/archlinux, OpenRC for apk.
  - &unit
    src: deploy/systemd/ovcp.service
    dst: /usr/lib/systemd/system/ovcp.service
    packager: deb
  - { <<: *unit, packager: rpm }
  - { <<: *unit, packager: archlinux }
  - src: deploy/openrc/ovcp.initd
    dst: /etc/init.d/ovcp
    packager: apk
    file_info:
      mode: 0755
  # OpenWrt also installs .apk (apk-tools replaced opkg there), but runs
  # procd, not OpenRC — postinstall.sh swaps this in over the OpenRC
  # script above when /etc/rc.common (procd's marker) is present.
  - src: deploy/openwrt/ovcp.init
    dst: /usr/lib/ovcp/ovcp.procd-init
    packager: apk
    file_info:
      mode: 0755
